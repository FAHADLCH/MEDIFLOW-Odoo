<?xml version="1.0" encoding="UTF-8"?>
<!-- MEDIFLOW by SA Systems — Odoo app icon (square, vector source) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MEDIFLOW by SA Systems icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5232A"/>
      <stop offset="1" stop-color="#1B5E7E"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#E6ECF1" stroke-width="2"/>

  <!-- accent arc bottom -->
  <path d="M16 400 q256 96 480 0 v80 a16 16 0 0 1 -16 16 H32 a16 16 0 0 1 -16 -16 Z" fill="url(#accent)" opacity="0.12"/>

  <!-- SA Systems honeycomb mark, centered -->
  <g transform="translate(96 70) scale(0.92)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <polygon points="157,60 205.5,88 205.5,144 157,172 108.5,144 108.5,88" stroke="#DCDDDE"/>
    <polygon points="157,172 205.5,200 205.5,256 157,284 108.5,256 108.5,200" stroke="#DCDDDE"/>
    <polygon points="60,4 108.5,32 108.5,88 60,116 11.5,88 11.5,32" stroke="#E5232A"/>
    <polygon points="60,116 108.5,144 108.5,200 60,228 11.5,200 11.5,144" stroke="#E5232A"/>
    <polygon points="254,4 302.5,32 302.5,88 254,116 205.5,88 205.5,32" stroke="#E5232A"/>
    <polygon points="254,116 302.5,144 302.5,200 254,228 205.5,200 205.5,144" stroke="#E5232A"/>
    <line x1="116" y1="144" x2="198" y2="144" stroke="#E5232A"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="256" y="430" font-size="62" font-weight="700" fill="#0B1F2A" letter-spacing="2">MEDI<tspan fill="#1B5E7E" font-weight="300">FLOW</tspan></text>
    <text x="256" y="466" font-size="22" font-weight="600" fill="#5B7282" letter-spacing="3">by <tspan fill="#0B0B0B" font-weight="700">SA SYSTEMS</tspan></text>
